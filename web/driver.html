<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tài xế - RIDE-RTREE</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="shared/style.css"></head>
<body><div class="app-layout"><aside class="sidebar">
  <div class="sidebar-header"><h2>🚗 Tài xế <span id="driverDisplayId">D001</span></h2><a href="index.html" class="back-link">Trang chủ</a></div>
  <section class="panel"><div>Trạng thái: <strong id="driverStatus" class="status-available">Đang tải…</strong></div><div class="muted" id="driverLocation">Vị trí: chưa có dữ liệu</div></section>
  <div id="driverNotice" class="notice notice-info">Đang tải dữ liệu…</div><h3>Cuốc xe đang chờ gần bạn</h3>
  <div class="rides-list stack-list" id="ridesList"><div class="empty-state">Đang tải danh sách cuốc xe…</div></div>
</aside><main class="map-container" id="map" aria-label="Bản đồ tài xế và điểm đón"></main></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="shared/app.js"></script>
<script>
(() => {
  const driverId = (localStorage.getItem('userId') || 'D001').trim(); setText('driverDisplayId', driverId);
  const map = L.map('map').setView([10.7769, 106.7009], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
  const notice = document.getElementById('driverNotice'); const list = document.getElementById('ridesList');
  let driverMarker = null; const rideMarkers = new Map(); let currentDriver = null; const accepting = new Set();
  async function refreshDriver() {
    const payload = await apiGet('/drivers');
    if (payload === null) { showNotice(notice, 'Không thể tải tài xế. Hãy kiểm tra server.', 'error'); return; }
    const drivers = normalizeArray(payload); currentDriver = drivers.find(d => String(d.id).toUpperCase() === driverId.toUpperCase());
    if (!currentDriver) { setText('driverStatus', 'Không tìm thấy ID'); showNotice(notice, `Không tìm thấy tài xế ${driverId} trong GET /api/drivers.`, 'error'); return; }
    setText('driverStatus', currentDriver.status || 'UNKNOWN'); document.getElementById('driverStatus').className = currentDriver.status === 'AVAILABLE' ? 'status-available' : 'status-busy';
    setText('driverLocation', `Vị trí: ${Number(currentDriver.lat).toFixed(5)}, ${Number(currentDriver.lng).toFixed(5)}`);
    if (validLatLng(currentDriver)) {
      const point = [Number(currentDriver.lat), Number(currentDriver.lng)];
      if (!driverMarker) driverMarker = L.marker(point).addTo(map).bindPopup(`Tài xế ${escapeHtml(driverId)}`); else driverMarker.setLatLng(point);
      if (!window.driverMapCentered) { map.setView(point, 15); window.driverMapCentered = true; }
    }
  }
  async function refreshRides() {
    if (!currentDriver) return;
    const query = `?lat=${encodeURIComponent(currentDriver.lat)}&lng=${encodeURIComponent(currentDriver.lng)}`;
    const payload = await apiGet(`/rides/nearby${query}`);
    if (payload === null) { showNotice(notice, 'Không lấy được cuốc xe gần đây. API /rides/nearby có thể chưa hoạt động.', 'error'); return; }
    const rides = normalizeArray(payload).filter(r => r.status === 'PENDING');
    showNotice(notice, `Đang cập nhật mỗi 2,5 giây · ${rides.length} cuốc xe đang chờ.`, 'success');
    const activeIds = new Set(rides.map(r => String(r.id)));
    for (const [id, marker] of rideMarkers) if (!activeIds.has(id)) { map.removeLayer(marker); rideMarkers.delete(id); }
    rides.forEach(ride => {
      if (validLatLng(ride.pickup)) {
        const p = [Number(ride.pickup.lat), Number(ride.pickup.lng)];
        if (!rideMarkers.has(String(ride.id))) rideMarkers.set(String(ride.id), L.circleMarker(p, { radius: 8, color: '#e67e22', fillColor: '#f39c12', fillOpacity: .9 }).addTo(map));
        rideMarkers.get(String(ride.id)).setLatLng(p).bindPopup(`Cuốc ${escapeHtml(ride.id)} · ${formatKm(ride.distanceKm)}`);
      }
    });
    if (!rides.length) { list.innerHTML = '<div class="empty-state">Hiện chưa có cuốc xe đang chờ gần vị trí của bạn.</div>'; return; }
    list.innerHTML = rides.map(ride => `<article class="list-card"><div class="list-card-head"><strong>${escapeHtml(ride.id)}</strong><span class="badge badge-pending">${escapeHtml(ride.status)}</span></div><div class="small-line">Điểm đón: ${Number(ride.pickup.lat).toFixed(5)}, ${Number(ride.pickup.lng).toFixed(5)}</div><div class="small-line">Điểm đến: ${Number(ride.destination.lat).toFixed(5)}, ${Number(ride.destination.lng).toFixed(5)}</div><div class="small-line">Khoảng cách: ${formatKm(ride.distanceKm)}</div><button class="btn btn-success btn-block" data-ride-id="${escapeHtml(ride.id)}" ${accepting.has(String(ride.id)) || currentDriver.status !== 'AVAILABLE' ? 'disabled' : ''}>Nhận cuốc</button></article>`).join('');
  }
  list.addEventListener('click', async event => {
    const button = event.target.closest('button[data-ride-id]'); if (!button) return;
    const id = button.dataset.rideId; if (accepting.has(id)) return;
    accepting.add(id); button.disabled = true; button.textContent = 'Đang nhận…';
    const result = await apiPost(`/rides/${encodeURIComponent(id)}/accept`, { driverId });
    accepting.delete(id);
    if (result && result.success) { showNotice(notice, `Đã nhận cuốc ${id}.`, 'success'); await refreshDriver(); await refreshRides(); }
    else { showNotice(notice, `Không nhận được cuốc ${id}. Cuốc có thể đã được nhận hoặc API báo lỗi.`, 'error'); await refreshRides(); }
  });
  startPolling(async () => { await refreshDriver(); await refreshRides(); }, 2500);
})();
</script></body></html>
