<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị Viên - Giám Sát Bản Đồ (RIDE-RTREE)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="shared/style.css">
    <!-- Người phụ trách: Vương -->
</head>
<body>
    <div class="app-layout">
        <div class="sidebar admin-sidebar">
            <div class="sidebar-header">
                <h2>🗺️ Giám Sát Hệ Thống</h2>
                <a href="index.html" class="back-link">Đổi vai trò</a>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="totalDriversCount">0</div>
                    <div class="stat-label">Tổng Tài Xế</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="activeRidesCount">0</div>
                    <div class="stat-label">Cuốc Xe Hoạt Động</div>
                </div>
            </div>

            <h3>Danh sách cuốc xe trong hệ thống</h3>
            <div class="admin-orders-table-wrapper">
                <table class="data-table" id="ridesTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Trạng Thái</th>
                            <th>Tài Xế</th>
                        </tr>
                    </thead>
                    <tbody id="ridesTableBody">
                        <tr><td colspan="3">Chưa có cuốc xe nào</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="map-container" id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="shared/app.js"></script>
    <script>
        const map = L.map('map').setView([10.7769, 106.7009], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const driverMarkers = new Map();
        const driverColors = {
            AVAILABLE: '#16a34a',
            BUSY: '#dc2626',
            IN_TRIP: '#dc2626',
            ON_TRIP: '#dc2626',
            OFFLINE: '#64748b'
        };

        // Hàm trích xuất tọa độ linh hoạt (hỗ trợ lat/lng, latitude/longitude, y/x)
        function getCoords(driver) {
            const lat = Number(driver.lat ?? driver.latitude ?? driver.y);
            const lng = Number(driver.lng ?? driver.longitude ?? driver.x);
            if (Number.isFinite(lat) && Number.isFinite(lng)) {
                return [lat, lng];
            }
            return null;
        }

        function createDriverMarker(driver, coords) {
            const statusKey = String(driver.status || '').toUpperCase();
            const color = driverColors[statusKey] || '#2563eb';
            return L.circleMarker(coords, {
                radius: 7,
                color: '#ffffff',
                weight: 2,
                fillColor: color,
                fillOpacity: 1
            }).addTo(map);
        }

        function renderDrivers(drivers) {
            const currentIds = new Set();

            drivers.forEach(driver => {
                if (!driver || !driver.id) return;
                const coords = getCoords(driver);
                if (!coords) return;

                currentIds.add(driver.id);
                let marker = driverMarkers.get(driver.id);
                const statusKey = String(driver.status || '').toUpperCase();
                const color = driverColors[statusKey] || '#2563eb';
                const popup = `<b>${String(driver.name || driver.id)}</b><br>` +
                    `Mã: ${String(driver.id)}<br>Trạng thái: ${String(driver.status || 'UNKNOWN')}`;

                if (!marker) {
                    marker = createDriverMarker(driver, coords);
                    driverMarkers.set(driver.id, marker);
                } else {
                    marker.setLatLng(coords);
                    marker.setStyle({ fillColor: color });
                }
                marker.bindPopup(popup);
            });

            for (const [id, marker] of driverMarkers) {
                if (!currentIds.has(id)) {
                    map.removeLayer(marker);
                    driverMarkers.delete(id);
                }
            }

            // Cập nhật thẻ Tổng Tài Xế
            const totalEl = document.getElementById('totalDriversCount');
            if (totalEl) {
                totalEl.textContent = currentIds.size || drivers.length;
            }
        }

        // Tạo badge màu sắc cho từng loại trạng thái
        function createStatusBadge(statusStr) {
            const status = String(statusStr || 'UNKNOWN').toUpperCase();
            let bg = '#f1f5f9', color = '#475569';

            if (['AVAILABLE', 'COMPLETED'].includes(status)) {
                bg = '#dcfce7'; color = '#15803d'; // Xanh lá
            } else if (['BUSY', 'IN_TRIP', 'ON_TRIP', 'ACCEPTED'].includes(status)) {
                bg = '#fee2e2'; color = '#b91c1c'; // Đỏ
            } else if (['PENDING', 'SEARCHING'].includes(status)) {
                bg = '#fef3c7'; color = '#b45309'; // Vàng
            }

            return `<span style="background: ${bg}; color: ${color}; padding: 3px 8px; border-radius: 4px; font-weight: 600; font-size: 0.82em; display: inline-block;">${status}</span>`;
        }

        function renderRides(rides, drivers = []) {
            const tbody = document.getElementById('ridesTableBody');
            if (!tbody) return;
            tbody.replaceChildren();

            const activeStatuses = ['PENDING', 'ACCEPTED', 'IN_TRIP', 'BUSY', 'ON_TRIP'];

            // 1. Tính toán số cuốc xe / tài xế đang hoạt động
            let activeCount = 0;
            const hasRidesData = Array.isArray(rides) && rides.length > 0;

            if (hasRidesData) {
                activeCount = rides.filter(ride => 
                    activeStatuses.includes(String(ride.status || '').toUpperCase())
                ).length;
            } else if (Array.isArray(drivers) && drivers.length > 0) {
                activeCount = drivers.filter(d => 
                    ['BUSY', 'IN_TRIP', 'ON_TRIP', 'ACCEPTED'].includes(String(d.status || '').toUpperCase())
                ).length;
            }

            const activeEl = document.getElementById('activeRidesCount');
            if (activeEl) {
                activeEl.textContent = activeCount;
            }

            // 2. Render dữ liệu vào bảng
            if (hasRidesData) {
                rides.forEach(ride => {
                    const row = tbody.insertRow();
                    row.insertCell().textContent = ride.id || '—';
                    row.insertCell().innerHTML = createStatusBadge(ride.status);
                    row.insertCell().textContent = ride.assignedDriverId || ride.driverName || 'Chưa có';
                });
            } else if (Array.isArray(drivers) && drivers.length > 0) {
                // Hiển thị danh sách tài xế nếu chưa có dữ liệu cuốc xe riêng
                drivers.forEach(driver => {
                    const row = tbody.insertRow();
                    row.insertCell().textContent = driver.id || '—';
                    row.insertCell().innerHTML = createStatusBadge(driver.status);
                    row.insertCell().textContent = driver.name || driver.driverName || 'Tài xế';
                });
            } else {
                const row = tbody.insertRow();
                const cell = row.insertCell();
                cell.colSpan = 3;
                cell.textContent = 'Chưa có cuốc xe nào';
            }
        }

        async function updateOverview() {
            let overview = null;

            // 1. Thử gọi API backend nếu hàm apiGet tồn tại
            if (typeof apiGet === 'function') {
                try {
                    overview = await apiGet('/admin/overview');
                } catch (e) {
                    console.warn('API chưa sẵn sàng, chuyển sang nạp file json mẫu.');
                }
            }

            // 2. Dự phòng: Đọc trực tiếp từ file drivers.json
            if (!overview || (!overview.drivers && !overview.rides)) {
                try {
                    let res = await fetch('../data/sample/drivers.json');
                    if (!res.ok) res = await fetch('data/sample/drivers.json');
                    if (res.ok) {
                        const driversData = await res.json();
                        overview = { drivers: driversData, rides: [] };
                    }
                } catch (err) {
                    console.error('Lỗi khi tải drivers.json:', err);
                }
            }

            if (!overview) return;

            const drivers = Array.isArray(overview.drivers) ? overview.drivers : [];
            const rides = Array.isArray(overview.rides) ? overview.rides : [];

            renderDrivers(drivers);
            renderRides(rides, drivers);
        }

        // Khởi chạy vòng lặp cập nhật dữ liệu
        if (typeof startPolling === 'function') {
            startPolling(updateOverview, 2000);
        } else {
            updateOverview();
            setInterval(updateOverview, 2000);
        }
    </script>
</body>
</html>
