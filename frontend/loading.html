<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Navigo — Đang khởi động hệ thống di chuyển xanh...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/loading-splash.css">
    <script>
        // Check redirect trigger flags
        const urlParams = new URLSearchParams(window.location.search);
        const fromAction = urlParams.get('from');
        const force = urlParams.get('force');

        // If coming from login or logout, ALWAYS force full loading screen animation
        if (fromAction === 'login' || fromAction === 'logout' || force === '1' || force === 'true') {
            try {
                sessionStorage.removeItem('navigo_session_loaded');
                sessionStorage.removeItem('navigo_loading_screen_active');
            } catch(e) {}
        } else if (sessionStorage.getItem('navigo_session_loaded') === 'true') {
            // If already in an active session without explicit login/logout trigger, go straight to Trang Chủ
            window.location.replace('index.html');
        }
    </script>
</head>
<body>
    <div class="navigo-loading-backdrop" id="loading-backdrop">
        <div class="loading-app-container">
            <!-- 1. Ambient Holographic Aurora Mesh Background -->
            <div class="bg-aurora-mesh">
                <div class="aurora-orb orb-1"></div>
                <div class="aurora-orb orb-2"></div>
                <div class="aurora-orb orb-3"></div>
            </div>

            <!-- 2. Authentic Blueprint Street Map Texture -->
            <div class="bg-map-texture"></div>

            <!-- 3. Flowing Neon Dashed GPS Track SVG with Gradient -->
            <svg class="bg-gps-svg" viewBox="0 0 500 400" preserveAspectRatio="none">
                <defs>
                    <linearGradient id="gpsGradTeal" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#00b1a9"/>
                        <stop offset="50%" stop-color="#10b981"/>
                        <stop offset="100%" stop-color="#38ef7d"/>
                    </linearGradient>
                </defs>
                <path class="gps-flow-path" d="M -50,150 C 120,80 180,260 340,190 C 420,160 480,240 550,210" />
                <path class="gps-flow-path-subtle" d="M -20,240 C 90,180 200,320 360,250 C 440,210 500,290 560,260" />
            </svg>

            <!-- 4. Ambient Rising Energy Photons -->
            <div class="ambient-energy-layer">
                <div class="energy-particle" style="top:15%; left:12%; width:10px; height:10px; animation-duration:4.5s; animation-delay:0.2s;"></div>
                <div class="energy-particle" style="top:38%; left:86%; width:14px; height:14px; animation-duration:5.2s; animation-delay:1.1s;"></div>
                <div class="energy-particle" style="top:65%; left:20%; width:9px; height:9px; animation-duration:3.8s; animation-delay:0s;"></div>
                <div class="energy-particle" style="top:55%; left:78%; width:12px; height:12px; animation-duration:4.6s; animation-delay:1.6s;"></div>
                <div class="energy-particle" style="top:80%; left:45%; width:8px; height:8px; animation-duration:4.0s; animation-delay:0.8s;"></div>
                <div class="energy-particle" style="top:25%; left:62%; width:11px; height:11px; animation-duration:5.0s; animation-delay:2.1s;"></div>
            </div>

            <!-- 5. Center Hero Section with High-Fidelity Physics -->
            <div class="hero-center-stage">
                <!-- Top Mini Floating Brand Pill -->
                <div class="loading-brand-pill">
                    <img src="assets/gsm/navigo-logo.svg" alt="Navigo" class="loading-pill-logo">
                    <span class="loading-pill-text">Navigo EV <span class="loading-pill-dot"></span></span>
                </div>

                <div class="illustration-box">
                    <!-- Dynamic Wind Streaks -->
                    <div class="wind-motion-wrapper">
                        <div class="wind-streak w1"></div>
                        <div class="wind-streak w2"></div>
                        <div class="wind-streak w3"></div>
                        <div class="wind-streak w4"></div>
                    </div>

                    <!-- Underglow Neon Light -->
                    <div class="car-underglow-neon"></div>

                    <!-- Base Electric Car + Map with Suspension Hovering -->
                    <img src="assets/gsm/loading_hero_car_map.png" alt="Navigo EV Car" class="hero-base-img">

                    <!-- Radar Pulse on Location Pin -->
                    <div class="pin-radar-beacon"></div>

                    <!-- Independent Floating Service Badges -->
                    <img src="assets/gsm/bubble_food.png" alt="Food" class="service-bubble b-food" title="Đồ ăn & Giao món">
                    <img src="assets/gsm/bubble_package.png" alt="Package" class="service-bubble b-package" title="Giao hàng nhanh">
                    <img src="assets/gsm/bubble_bus.png" alt="VinBus" class="service-bubble b-bus" title="VinBus thuần điện">
                </div>

                <!-- Branding Typography -->
                <div class="brand-headline-box">
                    <h1 class="brand-name">NAVIGO</h1>
                    <div class="brand-greeting" id="brand-greeting">Di Chuyển Xanh Thuần Điện</div>
                </div>
            </div>

            <!-- 6. Digital EV Battery Charging Progress Dashboard -->
            <div class="loading-footer-status">
                <div class="ev-progress-meta-row">
                    <div class="ev-energy-tag">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="#00b1a9">
                            <path d="M7 2v11h3v9l7-12h-4l4-8z"/>
                        </svg>
                        <span>Hệ Thống 800V Sẵn Sàng</span>
                    </div>
                    <div class="ev-percent-num" id="loading-percentage">0%</div>
                </div>

                <div class="ev-progress-track">
                    <div class="ev-progress-bar-fill" id="loading-progress-bar"></div>
                </div>

                <div class="status-primary-text" id="status-primary">
                    ⚡ Khởi động động cơ điện &amp; định vị GPS...
                </div>
                <div class="status-secondary-text" id="status-secondary">
                    Dẫn lối chuẩn xác • Đón rước tận nơi • 0 Phát thải
                </div>
            </div>
        </div>
    </div>

    <!-- Script: 60/120 FPS requestAnimationFrame progress & transition to Trang Chủ (index.html) -->
    <script>
        const LOADING_DURATION_MS = 2100;
        const FADE_TRANSITION_MS = 450;

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const fromAction = urlParams.get('from');
            const force = urlParams.get('force');

            // Force loading screen if coming from login or logout
            if (fromAction === 'login' || fromAction === 'logout' || force === '1' || force === 'true') {
                try {
                    sessionStorage.removeItem('navigo_session_loaded');
                } catch(e) {}
            } else if (sessionStorage.getItem('navigo_session_loaded') === 'true') {
                window.location.replace('index.html');
                return;
            }

            const greetingEl = document.getElementById('brand-greeting');
            const primaryEl = document.getElementById('status-primary');
            const secondaryEl = document.getElementById('status-secondary');
            const percentEl = document.getElementById('loading-percentage');
            const barEl = document.getElementById('loading-progress-bar');
            const backdrop = document.getElementById('loading-backdrop');

            let customMode = false;
            if (fromAction === 'login') {
                customMode = true;
                let userName = '';
                try {
                    const raw = localStorage.getItem('goride_user') || localStorage.getItem('navigo_user');
                    if (raw) {
                        const u = JSON.parse(raw);
                        userName = u.name || u.fullName || '';
                    }
                } catch(e) {}

                if (greetingEl) {
                    greetingEl.textContent = userName ? `Xin Chào, ${userName}!` : 'Đăng Nhập Thành Công!';
                }
                if (secondaryEl) {
                    secondaryEl.textContent = 'Chào mừng bạn trở lại với hệ sinh thái di chuyển xanh';
                }
            } else if (fromAction === 'logout') {
                customMode = true;
                if (greetingEl) {
                    greetingEl.textContent = 'Hẹn Gặp Lại Quý Khách!';
                }
                if (secondaryEl) {
                    secondaryEl.textContent = 'Đã đăng xuất tài khoản an toàn';
                }
            }

            // Strictly prevent location prompts during loading
            sessionStorage.setItem('navigo_loading_screen_active', 'true');

            // 60/120 FPS Mathematical Progress Counter
            const startTime = performance.now();

            function frame(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / LOADING_DURATION_MS, 1);
                
                // Natural deceleration curve (energetic start, smooth finish)
                const eased = 1 - Math.pow(1 - progress, 2.4);
                const percent = Math.min(100, Math.floor(eased * 100));

                if (percentEl) percentEl.textContent = `${percent}%`;
                if (barEl) barEl.style.width = `${percent}%`;

                if (primaryEl && !customMode) {
                    if (percent < 30) {
                        primaryEl.innerHTML = '⚡ Khởi động động cơ điện &amp; định vị GPS...';
                    } else if (percent < 68) {
                        primaryEl.innerHTML = '📡 Kết nối bản đồ không gian &amp; trạm sạc...';
                    } else if (percent < 95) {
                        primaryEl.innerHTML = '🌿 Tối ưu tuyến đường xanh 0 phát thải...';
                    } else {
                        primaryEl.innerHTML = '✨ Sẵn sàng trải nghiệm cùng Navigo!';
                    }
                } else if (primaryEl && customMode) {
                    if (fromAction === 'login') {
                        primaryEl.innerHTML = percent < 90 ? '⚡ Đang đồng bộ dữ liệu tài khoản...' : '✨ Đang chuyển hướng về trang chủ...';
                    } else if (fromAction === 'logout') {
                        primaryEl.innerHTML = percent < 90 ? '🔒 Đang hoàn tất phiên làm việc...' : '✨ Đang chuyển hướng về trang chủ...';
                    }
                }

                if (progress < 1) {
                    requestAnimationFrame(frame);
                } else {
                    if (percentEl) percentEl.textContent = '100%';
                    if (barEl) barEl.style.width = '100%';

                    // Smooth Exit Sequence
                    setTimeout(() => {
                        if (backdrop) {
                            backdrop.classList.add('fade-out');
                        }

                        setTimeout(() => {
                            sessionStorage.removeItem('navigo_loading_screen_active');
                            sessionStorage.setItem('navigo_from_loading', 'true');
                            sessionStorage.setItem('navigo_session_loaded', 'true');

                            // Redirect cleanly to Trang chủ
                            window.location.replace('index.html');
                        }, FADE_TRANSITION_MS);
                    }, 220);
                }
            }

            requestAnimationFrame(frame);
        });
    </script>
</body>
</html>
