<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#f4fbf9">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Navigo — Đang khởi tạo lộ trình xanh...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/loading-splash.css">
    <script>
        // Check redirect trigger flags
        const urlParams = new URLSearchParams(window.location.search);
        const fromAction = urlParams.get('from');
        const force = urlParams.get('force');

        // If coming from login or logout, ALWAYS force full loading screen animation
        if (fromAction === 'login' || fromAction === 'logout' || force === '1' || force === 'true') {
            try {
                sessionStorage.removeItem('navigo_session_loaded');
                sessionStorage.removeItem('navigo_loading_screen_active');
            } catch(e) {}
        } else if (sessionStorage.getItem('navigo_session_loaded') === 'true') {
            // If already in an active session without explicit login/logout trigger, go straight to Trang Chủ
            window.location.replace('index.html');
        }
    </script>
</head>
<body class="navigo-loading-page">
    <div class="navigo-loading-backdrop" id="loading-backdrop">
        <div class="loading-main-stage">
            
            <!-- 1. Top Brand Header: Navigo Squircle Logo + Name -->
            <div class="loading-brand-header">

                        <circle cx="24" cy="8" r="2.5" fill="#38ef7d"/>
                        <circle cx="8" cy="24" r="2.5" fill="#38ef7d"/>
                    </svg>
                </div>
                <div class="brand-text-col">
                    <h1 class="brand-text-title">NAVIGO</h1>
                    <div class="brand-text-sub">DI CHUYỂN XANH</div>
                </div>
            </div>

            <!-- 2. The 3D S-Curve Eco Road Scene with Interactive Vectors -->
            <div class="loading-scene-wrapper">
                <svg class="loading-eco-svg" id="loading-svg-canvas" viewBox="0 0 920 400" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <!-- Road Glowing Teal Gradient -->
                        <linearGradient id="roadTealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#00a89f"/>
                            <stop offset="50%" stop-color="#00b1a9"/>
                            <stop offset="85%" stop-color="#10b981"/>
                            <stop offset="100%" stop-color="#34d399"/>
                        </linearGradient>

                        <!-- Road Under-Bevel 3D Shading -->
                        <linearGradient id="roadBevelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#007d77"/>
                            <stop offset="50%" stop-color="#008983"/>
                            <stop offset="85%" stop-color="#059669"/>
                            <stop offset="100%" stop-color="#cbd5e1"/>
                        </linearGradient>

                        <!-- Wind Stream Trail Gradient -->
                        <linearGradient id="windTrailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="rgba(0, 177, 169, 0)"/>
                            <stop offset="40%" stop-color="rgba(0, 177, 169, 0.45)"/>
                            <stop offset="80%" stop-color="rgba(52, 211, 153, 0.75)"/>
                            <stop offset="100%" stop-color="rgba(255, 255, 255, 0.9)"/>
                        </linearGradient>

                        <!-- Destination Pin Vibrant Coral Gradient -->
                        <linearGradient id="pinCoralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ff758c"/>
                            <stop offset="60%" stop-color="#ff4757"/>
                            <stop offset="100%" stop-color="#e02839"/>
                        </linearGradient>

                        <!-- Car Body Metallic White & Teal Gradient -->
                        <linearGradient id="carBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#ffffff"/>
                            <stop offset="70%" stop-color="#f8fafc"/>
                            <stop offset="100%" stop-color="#e2e8f0"/>
                        </linearGradient>

                        <!-- Shadow Filters -->
                        <filter id="roadGlowFilter" x="-10%" y="-30%" width="120%" height="160%">
                            <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#00b1a9" flood-opacity="0.32"/>
                        </filter>
                        <filter id="carShadowFilter" x="-20%" y="-20%" width="140%" height="140%">

    <!-- Script: 60/120 FPS Progress Engine with Dynamic Vehicle Road Navigation -->
    <script>
        const LOADING_DURATION_MS = 2200;
        const FADE_TRANSITION_MS = 450;

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const fromAction = urlParams.get('from');
            const force = urlParams.get('force');

            // Force loading screen if coming from login or logout
            if (fromAction === 'login' || fromAction === 'logout' || force === '1' || force === 'true') {
                try {
                    sessionStorage.removeItem('navigo_session_loaded');
                } catch(e) {}
            } else if (sessionStorage.getItem('navigo_session_loaded') === 'true') {
                window.location.replace('index.html');
                return;
            }

            const statusLabel = document.getElementById('status-main-label');
            const percentEl = document.getElementById('loading-percentage');
            const roadFill = document.getElementById('road-progress-fill-path');
            const carNode = document.getElementById('ev-car-pos');
            const scooterNode = document.getElementById('ev-scooter-pos');
            const backdrop = document.getElementById('loading-backdrop');

            // Calculate precise mathematical road curve arc length
            let roadLength = 660;
            if (roadFill && typeof roadFill.getTotalLength === 'function') {
                try {
                    roadLength = roadFill.getTotalLength();
                } catch(e) {}
            }
            if (roadFill) {
                roadFill.style.strokeDasharray = roadLength;
                roadFill.style.strokeDashoffset = roadLength;
            }

            // Function to dynamically update vehicles along the exact S-Curve road path
            function updateRoadVehicles(progressRatio) {
                if (!roadFill || typeof roadFill.getPointAtLength !== 'function') return;

                const len = roadLength;
                // Scooter travels from ~150px to ~620px (pin is at 655px)
                const scooterDist = 150 + progressRatio * 470;
                // Car trails behind scooter by 115px (never overlaps!)
                const carDist = Math.max(35, scooterDist - 115);

                // 1. Position Car on road surface & match road tangent slope
                const carP1 = roadFill.getPointAtLength(carDist);
                const carP2 = roadFill.getPointAtLength(Math.min(len, carDist + 4));
                const carAngle = Math.atan2(carP2.y - carP1.y, carP2.x - carP1.x) * (180 / Math.PI);

                if (carNode) {
                    carNode.setAttribute('transform', `translate(${carP1.x.toFixed(1)}, ${(carP1.y - 18).toFixed(1)}) rotate(${carAngle.toFixed(1)})`);
                }

                // 2. Position Scooter ahead on road surface
                const scP1 = roadFill.getPointAtLength(scooterDist);
                const scP2 = roadFill.getPointAtLength(Math.min(len, scooterDist + 4));
                const scAngle = Math.atan2(scP2.y - scP1.y, scP2.x - scP1.x) * (180 / Math.PI);

                if (scooterNode) {
                    scooterNode.setAttribute('transform', `translate(${scP1.x.toFixed(1)}, ${(scP1.y - 15).toFixed(1)}) rotate(${scAngle.toFixed(1)})`);
                }

                // 3. Fill glowing road path seamlessly to match the lead scooter!
                const activeFill = Math.min(len, scooterDist + 15);
                roadFill.style.strokeDashoffset = len - activeFill;
            }

            // Initial positioning
            updateRoadVehicles(0);

            let customMode = false;
            if (fromAction === 'login') {
                customMode = true;
                let userName = '';
                try {
                    const raw = localStorage.getItem('goride_user') || localStorage.getItem('navigo_user');
                    if (raw) {
                        const u = JSON.parse(raw);
                        userName = u.name || u.fullName || '';
                    }
                } catch(e) {}

                if (statusLabel) {
                    statusLabel.textContent = userName ? `Chào mừng ${userName} quay trở lại...` : 'Đang đồng bộ dữ liệu tài khoản...';
                }
            } else if (fromAction === 'logout') {
                customMode = true;
                if (statusLabel) {
                    statusLabel.textContent = 'Đang hoàn tất đăng xuất an toàn...';
                }
            }

            // Strictly prevent location prompts during loading
            sessionStorage.setItem('navigo_loading_screen_active', 'true');

            // 60/120 FPS Mathematical Progress Counter
            const startTime = performance.now();

            function frame(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / LOADING_DURATION_MS, 1);
                
                // Natural deceleration curve (energetic start, smooth finish)
                const eased = 1 - Math.pow(1 - progress, 2.4);
                const percent = Math.min(100, Math.floor(eased * 100));

                if (percentEl) percentEl.textContent = `${percent}%`;

                // Update vehicles dynamically along the road
                updateRoadVehicles(eased);

                if (statusLabel && !customMode) {
                    if (percent < 35) {
                        statusLabel.textContent = 'Đang khởi tạo lộ trình xanh cho bạn...';
                    } else if (percent < 75) {
                        statusLabel.textContent = 'Tối ưu tuyến đường thuần điện 0 phát thải...';
                    } else if (percent < 95) {
                        statusLabel.textContent = 'Kết nối phương tiện & trạm sạc thông minh...';
                    } else {
                        statusLabel.textContent = 'Sẵn sàng trải nghiệm cùng Navigo!';
                    }
                }

                if (progress < 1) {
                    requestAnimationFrame(frame);
                } else {
                    if (percentEl) percentEl.textContent = '100%';
                    updateRoadVehicles(1);

                    // Smooth Exit Sequence
                    setTimeout(() => {
                        if (backdrop) {
                            backdrop.classList.add('fade-out');
                        }

                        setTimeout(() => {
                            sessionStorage.removeItem('navigo_loading_screen_active');
                            sessionStorage.setItem('navigo_from_loading', 'true');
                            sessionStorage.setItem('navigo_session_loaded', 'true');

                            // Redirect cleanly to Trang chủ
                            window.location.replace('index.html');
                        }, FADE_TRANSITION_MS);
                    }, 260);
                }
            }

            requestAnimationFrame(frame);
        });
    </script>
</body>
</html>
