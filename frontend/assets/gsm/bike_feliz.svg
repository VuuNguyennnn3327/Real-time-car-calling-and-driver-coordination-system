<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="100%" height="100%">
  <defs>
    <linearGradient id="scooterTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4de3db"/>
      <stop offset="60%" stop-color="#00b1a9"/>
      <stop offset="100%" stop-color="#006b66"/>
    </linearGradient>
    <filter id="bikeShadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f2d3c" flood-opacity="0.22"/>
    </filter>
  </defs>
  <g filter="url(#bikeShadow)">
    <!-- Shadow -->
    <ellipse cx="105" cy="120" rx="70" ry="10" fill="#0f2d3c" opacity="0.2"/>
    
    <!-- Rear Wheel -->
    <ellipse cx="50" cy="100" rx="20" ry="20" fill="#1e293b"/>
    <ellipse cx="50" cy="100" rx="10" ry="10" fill="#cbd5e1" stroke="#00b1a9" stroke-width="2"/>
    
    <!-- Front Wheel -->
    <ellipse cx="155" cy="100" rx="20" ry="20" fill="#1e293b"/>
    <ellipse cx="155" cy="100" rx="10" ry="10" fill="#cbd5e1" stroke="#00b1a9" stroke-width="2"/>
    
    <!-- Scooter Main Body (Floorboard, Seat, Rear Cover) -->
    <path d="M50 85 Q45 65 70 65 L110 65 Q115 75 110 95 L80 98 Q60 98 50 85 Z" fill="url(#scooterTeal)"/>
    <!-- Ergonomic Seat -->
    <path d="M58 64 Q85 62 112 64 Q110 58 85 58 Q60 58 58 64 Z" fill="#1e293b"/>
    
    <!-- Front Stem & Apron -->
    <path d="M105 92 L140 50 Q145 42 140 35 L132 35 L125 45 L98 90 Z" fill="url(#scooterTeal)"/>
    
    <!-- Handlebar & Headlight -->
    <path d="M128 35 L144 33 Q148 35 145 40 Z" fill="#1e293b"/>
    <ellipse cx="145" cy="38" rx="4" ry="4" fill="#ffffff" filter="drop-shadow(0 0 3px #4de3db)"/>
    <circle cx="132" cy="28" r="3" fill="#64748b"/>
    <path d="M132 28 L140 33" stroke="#64748b" stroke-width="2"/>
    
    <!-- Front Mudguard -->
    <path d="M142 85 Q155 75 168 88 L160 92 Q152 82 142 88 Z" fill="url(#scooterTeal)"/>
  </g>
</svg>