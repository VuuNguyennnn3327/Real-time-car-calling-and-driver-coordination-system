<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Navigo Deep Electric Cyan -->
    <linearGradient id="navigoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b1a9"/>
      <stop offset="50%" stop-color="#08616f"/>
      <stop offset="100%" stop-color="#0b242e"/>
    </linearGradient>

    <!-- Eco Leaf Gradient (Left Wing) -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Pure Electric Velocity Gradient (Central Diagonal & Right Wing) -->
    <linearGradient id="electricGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0fdf4"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>

    <!-- Subtle Golden Spark Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Soft Ambient Glow -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#00b1a9" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base App Icon Tile -->
  <rect width="64" height="64" rx="16" fill="url(#navigoBg)"/>
  
  <!-- Sleek Inner Border -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1.5"/>

  <!-- Navigo EV Monogram "N" -->
  <g filter="url(#logoGlow)">
    <!-- 1. Left Vertical Eco Leaf Pillar -->
    <path d="M 16 46 C 16 47.5 17.5 48.5 19 47.5 L 23.5 44.5 C 24.5 43.8 25 42.5 25 41.2 L 25 21.5 C 25 18.2 21.5 16 18.5 17.8 L 17 18.8 C 16.3 19.3 16 20.2 16 21.2 Z" fill="url(#leafGrad)"/>

    <!-- 2. Dynamic Electric Navigation Diagonal (Navigo "Go" Arrow) -->
    <path d="M 19 18.5 C 20.2 17.2 22.5 17.5 23.5 19 L 41 42.5 C 41.8 43.5 43 43.5 43.8 42.8 L 46.5 40.5 C 47.5 39.8 48 38.5 48 37.2 L 48 19.5 C 48 18 46.5 17 45 18 L 40.5 21 C 39.5 21.8 39 23 39 24.2 L 39 37.5 L 24 17.5 C 22.8 15.8 20 16.5 19 18.5 Z" fill="url(#electricGrad)"/>

    <!-- 3. Eco Leaf Vein / Electric Flash Accent -->
    <path d="M 27 25 L 35 36" stroke="#00b1a9" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>

    <!-- 4. Pure Energy Spark (Top Navigation Star) -->
    <polygon points="46,14 47.5,17 50.5,18.5 47.5,20 46,23 44.5,20 41.5,18.5 44.5,17" fill="url(#sparkGrad)"/>
  </g>
</svg>
