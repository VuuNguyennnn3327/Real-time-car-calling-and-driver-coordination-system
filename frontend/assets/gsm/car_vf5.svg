<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4de3db"/>
      <stop offset="50%" stop-color="#00b1a9"/>
      <stop offset="100%" stop-color="#00807b"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f7f6"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a47"/>
      <stop offset="100%" stop-color="#0b171c"/>
    </linearGradient>
    <filter id="carShadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#0f2d3c" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#carShadow)">
    <!-- Shadow base -->
    <ellipse cx="120" cy="115" rx="85" ry="14" fill="#0f2d3c" opacity="0.2"/>
    <!-- Wheels -->
    <ellipse cx="65" cy="105" rx="18" ry="18" fill="#1e293b"/>
    <ellipse cx="65" cy="105" rx="10" ry="10" fill="#94a3b8" stroke="#00b1a9" stroke-width="2"/>
    <ellipse cx="175" cy="105" rx="18" ry="18" fill="#1e293b"/>
    <ellipse cx="175" cy="105" rx="10" ry="10" fill="#94a3b8" stroke="#00b1a9" stroke-width="2"/>
    
    <!-- Car Body Lower -->
    <path d="M35 85 Q40 68 70 65 L165 65 Q195 68 205 85 Q212 95 195 102 L45 102 Q30 95 35 85 Z" fill="url(#bodyGrad)"/>
    
    <!-- Cabin & Roof -->
    <path d="M72 65 L92 38 Q100 34 135 34 L155 35 Q168 38 180 65 Z" fill="url(#roofGrad)"/>
    <!-- Windshield & Windows -->
    <path d="M96 40 L130 40 L128 62 L80 62 Z" fill="url(#glassGrad)"/>
    <path d="M134 40 L158 40 L174 62 L132 62 Z" fill="url(#glassGrad)"/>
    
    <!-- Headlight & Front Grille with VinFast V-Wing -->
    <path d="M34 82 Q42 80 50 84 Q44 90 35 88 Z" fill="#ffffff" filter="drop-shadow(0 0 4px #4de3db)"/>
    <path d="M42 88 Q48 93 54 88" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Aerodynamic Side crease -->
    <path d="M55 82 Q120 86 190 78" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6" fill="none"/>
    <rect x="188" y="80" width="12" height="4" rx="2" fill="#ef4444"/>
  </g>
</svg>